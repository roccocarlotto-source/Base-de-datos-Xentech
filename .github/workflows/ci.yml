name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      # binaries.prisma.sh (descarga del motor de Prisma) flaquea de forma
      # intermitente desde los runners de GitHub Actions -- reintenta antes
      # de fallar el job entero por un problema de red externo, no de código.
      - name: prisma generate (con reintentos)
        run: |
          for intento in 1 2 3; do
            npm run prisma:generate 2>&1 | tee /tmp/prisma-generate.log && exit 0
            echo "prisma:generate falló (intento $intento/3), reintentando en 15s..."
            sleep 15
          done
          exit 1
      - name: DEBUG TEMPORAL -- reportar error de prisma:generate en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "DEBUG prisma:generate falló tras reintentos (run ${{ github.run_id }})" \
            --body-file /tmp/prisma-generate.log
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
