name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - name: prisma generate (debug temporal)
        run: npm run prisma:generate 2>&1 | tee /tmp/prisma-generate.log
      - name: DEBUG TEMPORAL -- reportar error de prisma:generate en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "DEBUG prisma:generate falló (run ${{ github.run_id }})" \
            --body-file /tmp/prisma-generate.log
      - name: typecheck (debug temporal)
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - name: DEBUG TEMPORAL -- reportar error de typecheck en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "DEBUG typecheck falló (run ${{ github.run_id }})" \
            --body-file /tmp/typecheck.log
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
