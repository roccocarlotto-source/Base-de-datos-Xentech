name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      # binaries.prisma.sh (descarga del motor de Prisma) flaquea de forma
      # intermitente desde los runners de Actions -- reintenta antes de
      # fallar el job por un problema de red externo, no de código. Ver
      # CLAUDE.md.
      - name: prisma generate + typecheck (con reintentos)
        run: |
          for intento in 1 2 3; do
            rm -rf node_modules/.prisma
            echo "=== intento $intento ===" >> /tmp/debug.log
            npm run prisma:generate >> /tmp/debug.log 2>&1
            gen_status=$?
            npm run typecheck >> /tmp/debug.log 2>&1
            tc_status=$?
            echo "=== intento $intento: generate=$gen_status typecheck=$tc_status ===" >> /tmp/debug.log
            if [ "$gen_status" -eq 0 ] && [ "$tc_status" -eq 0 ]; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: DEBUG TEMPORAL -- reportar log si falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "DEBUG PR#19 falló (run ${{ github.run_id }})" \
            --body-file /tmp/debug.log
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
